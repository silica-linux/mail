<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 812 350" width="812" height="350" font-family="Helvetica, Arial, sans-serif" font-size="10">
<title>Mail message row geometry, points (drawn at 2x)</title>
<defs><marker id="a" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 6 3 0 6z" fill="#c0392b"/></marker></defs>
<rect width="812" height="350" fill="#ffffff"/>
<g transform="translate(40 40)">
<rect width="552" height="160" fill="#ffffff" stroke="#b0b0b0" stroke-dasharray="4 3"/>
<rect x="-2" y="22" width="26" height="20" fill="none" stroke="#9db7d9"/>
<circle cx="11.0" cy="32" r="7.0" fill="#0088ff"/>
<rect x="34" y="14" width="300" height="36" fill="none" stroke="#e0b0a8" stroke-dasharray="2 2"/>
<text x="38" y="42" text-anchor="start" fill="#222" font-size="26" font-weight="bold">Sender name</text>
<rect x="452" y="18" width="100" height="32" fill="none" stroke="#e0b0a8" stroke-dasharray="2 2"/>
<text x="548" y="42" text-anchor="end" fill="#8a8a8a" font-size="22">13:16</text>
<rect x="34" y="52" width="460" height="32" fill="none" stroke="#e0b0a8" stroke-dasharray="2 2"/>
<text x="38" y="76" text-anchor="start" fill="#222" font-size="22">Subject of the message</text>
<rect x="34" y="86" width="518" height="60" fill="none" stroke="#e0b0a8" stroke-dasharray="2 2"/>
<text x="38" y="138" text-anchor="start" fill="#8a8a8a" font-size="22">Preview, two lines in gray…</text>
<line x1="34" y1="160" x2="552" y2="160" stroke="#e6e6e6" stroke-width="2"/>
</g>
<line x1="40" y1="26" x2="592" y2="26" stroke="#c0392b" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="316" y="22" text-anchor="middle" fill="#c0392b">276</text>
<line x1="606" y1="40" x2="606" y2="200" stroke="#c0392b" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="610" y="120" text-anchor="start" fill="#c0392b">80 (pitch 80)</text>
<line x1="40" y1="214" x2="74" y2="214" stroke="#c0392b" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="57.0" y="228" text-anchor="middle" fill="#c0392b">17</text>
<text x="610" y="224" fill="#333">sender: y 7, 18 tall, bold</text>
<text x="610" y="237" fill="#333">date: y 9, 16 tall, gray, right-aligned</text>
<text x="610" y="250" fill="#333">subject: y 26, 16 tall</text>
<text x="610" y="263" fill="#333">preview: y 43, 2 lines, 30 tall, gray</text>
<text x="610" y="276" fill="#333">unread dot: 13 × 10 at (−1, 11), #0088ff</text>
<text x="610" y="289" fill="#333">separator from x 17</text>
<text x="10" y="342" fill="#666">Message row, light (ML-01). Drawn at 2× scale; numbers are points.</text>
</svg>
