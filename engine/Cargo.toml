[package]
name = "silica-mail-engine"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "The mail engine of Silica: IMAP sync, SMTP sending, offline store and search over D-Bus"
publish = false

[dependencies]
ammonia = "3"
async-imap = { version = "0.10", default-features = false, features = ["runtime-tokio"] }
base64 = "0.22"
futures = "0.3"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "rustls-native-certs", "ring"] }
mail-parser = "0.11"
roxmltree = "0.20"
rusqlite = { version = "0.37", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "fs", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unreachable = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
